name: Docker image

# Builds docker/emuleqt/Dockerfile for amd64 and arm64 on native runners and
# pushes one multi-arch image to GHCR. release.yml calls this with the version
# (tags X.Y.Z, X.Y, latest); a manual run from main pushes `edge`.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; release.yml passes the tag
        type: string
        default: ''
      version:
        description: Release version X.Y.Z; empty = edge
        type: string
        default: ''
      geoip:
        description: Ship the GeoLite2-Country database from release.yml's geoip-db artifact
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty = the run's own commit
          submodules: true          # external/enodemeta, external/specialdlp

      - name: Fetch GeoLite2-Country database
        if: ${{ inputs.geoip }}
        uses: actions/download-artifact@v8
        with:
          name: geoip-db
          path: data/config

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emuleqt" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/emuleqt/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ inputs.version || 'edge' }}
            EMULE_ED3K_LOCKED=1
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create manifest list
        env:
          VERSION: ${{ inputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emuleqt"
          if [ -n "$VERSION" ]; then
            tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest")
          else
            tags=(-t "$IMAGE:edge")
          fi
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${VERSION:-edge}"
          echo "Pushed \`$IMAGE:${VERSION:-edge}\` (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
