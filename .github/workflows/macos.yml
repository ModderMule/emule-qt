name: macOS CI

# Tag pushes are handled by release.yml, which calls this workflow -- do not add a
# push/tags trigger here or a tag would build twice.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: clang_64
          modules: qthttpserver qtwebsockets qtmultimedia
          cache: true

      - name: Install build tools
        run: brew install ninja openssl@3

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bundle
        run: scripts/bundle-macos.sh --dmg build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-macOS
          path: build/eMuleQt-v*-macOS.dmg
          # Default is 'warn', which would leave the job green with no artifact
          # if the bundle script produced nothing.
          if-no-files-found: error

      # A dSYM binds to its binary by LC_UUID, and on Mach-O the -g debug info
      # lives in the .o files, not the linked binary -- the binary only carries a
      # debug map of N_OSO stubs pointing at object files that die with the
      # runner.  Without this step a crash report from a released .dmg
      # symbolicates to function names only, with no line numbers, which made
      # EMULE_RELEASE_DEBUG_INFO pointless for released macOS builds.
      #
      # Runs AFTER Bundle on purpose: bundle-macos.sh copies emulecored into the
      # .app and then rewrites both in-bundle binaries with install_name_tool and
      # re-signs them.  Only those copies ship, so they -- not the build outputs
      # -- are what the dSYMs must be generated from.
      - name: Generate dSYMs
        run: |
          set -euo pipefail

          APP="build/src/gui/emuleqt.app/Contents/MacOS"
          mkdir -p build/symbols

          for name in emuleqt emulecored; do
            dsymutil "$APP/$name" -o "build/symbols/$name.dSYM"
          done

          # dsymutil exits 0 even when it silently fails to find its object
          # files, so assert the result instead of assuming it: a dSYM whose UUID
          # does not match the shipped binary can never symbolicate a crash from
          # it.  Format is "UUID: <uuid> (<arch>) <path>".
          for name in emuleqt emulecored; do
            bin_uuid=$(dwarfdump --uuid "$APP/$name" | awk '{print $2}')
            sym_uuid=$(dwarfdump --uuid "build/symbols/$name.dSYM" | awk '{print $2}')
            if [ "$bin_uuid" != "$sym_uuid" ]; then
              echo "::error::dSYM UUID mismatch for $name: binary $bin_uuid, dSYM $sym_uuid"
              exit 1
            fi
            # Logged so a future crash report can be matched to this build
            # without downloading the artifact.
            echo "OK: $name $bin_uuid"
          done

      # Deliberately NOT named eMuleQt-v*: release.yml downloads that pattern and
      # publishes everything it finds, and the symbols do not belong in the public
      # release assets.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: debug-symbols-macos-v${{ env.APP_VERSION }}
          path: build/symbols/**
          if-no-files-found: error
