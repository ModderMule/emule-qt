name: macOS CI

on:
#  push:
#    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: clang_64
          modules: qthttpserver qtwebsockets qtmultimedia
          cache: true

      - name: Install build tools
        run: brew install ninja openssl@3

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bundle
        run: scripts/bundle-macos.sh --dmg build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-macOS
          path: build/eMuleQt-v${{ env.APP_VERSION }}-macOS.dmg
