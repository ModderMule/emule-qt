name: Linux CI

on:
#  push:
#    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            zlib1g-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: linux_gcc_64
          modules: qthttpserver qtwebsockets qtmultimedia
          cache: true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bundle
        run: scripts/bundle-linux.sh deploy-qt build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-linux-x86_64
          path: build/emuleqt-v*-linux-x86_64.tar.gz
