name: Linux CI

# Tag pushes are handled by release.yml, which calls this workflow -- do not add a
# push/tags trigger here or a tag would build twice.
on:
  workflow_call:
    inputs:
      geoip:
        description: Ship the GeoLite2-Country database from release.yml's geoip-db artifact
        type: boolean
        default: false
      ref:
        description: Commit to build; release.yml passes the tag, since its run is on main
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # The glibc of the build host is the floor of the tarball, so build in an
    # Ubuntu 22.04 container (glibc 2.35). Not the ubuntu-22.04 runner: GitHub is
    # retiring it. Never ubuntu-latest: v0.6.23 came from a 26.04 runner and
    # needed glibc 2.43 (issues #43, #44). Change only together with GLIBC_MAX below.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      QT_VERSION: "6.10.3"
      QT_ROOT_DIR: /opt/Qt/6.10.3/gcc_64
      # 22.04 default is GCC 11; GCC 12 is the newest in its archive. Code must
      # stay buildable with it (no std::ranges::contains, std::print, ...).
      CC: gcc-12
      CXX: g++-12

    steps:
      # Before checkout: without git it falls back to a tarball, without submodules
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git squashfs-tools binutils \
            gcc-12 g++-12 ninja-build ccache pkg-config \
            python3 python3-pip python3-venv \
            protobuf-compiler \
            libssl-dev zlib1g-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libdbus-1-dev libglib2.0-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-randr0-dev
          # 22.04 ships CMake 3.22; the project needs 3.25+
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install --quiet 'cmake~=3.31' aqtinstall
          echo /opt/tools/bin >> "$GITHUB_PATH"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"   # qmake for linuxdeploy-plugin-qt

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty = the run's own commit
          submodules: true   # external/enodemeta: .proto + test vectors

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/Qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-httpserver-websockets-multimedia-grpc

      # aqt directly (what install-qt-action wraps): no host Python setup in the container
      - name: Install Qt 6
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64
          -m qthttpserver qtwebsockets qtmultimedia qtgrpc
          -O /opt/Qt

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF
          -DEMULE_SEED_FROM_SOURCE_TREE=OFF

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release builds only: release.yml downloads the database once and hands it
      # to all three platforms; the bundlers copy data/config wholesale.
      - name: Fetch GeoLite2-Country database
        if: ${{ inputs.geoip }}
        uses: actions/download-artifact@v8
        with:
          name: geoip-db
          path: data/config

      - name: Bundle
        env:
          GLIBC_MAX: "2.35"   # Ubuntu 22.04, Linux Mint 21, Debian 12
        run: scripts/bundle-linux.sh deploy-qt build

      # The bundle script checks that the files are there; this checks that the
      # shipped bridge starts from the unpacked tarball with its bundled libs.
      - name: Smoke-test the bundled MCP bridge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          tar xzf build/eMuleQt-v*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/eMuleQt/emuleqt-mcp" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-linux-x86_64
          path: build/eMuleQt-v*-linux-x86_64.tar.gz
          # Default is 'warn', which would leave the job green with no artifact
          # if the bundle script produced nothing.
          if-no-files-found: error
