name: Linux CI

# Tag pushes are handled by release.yml, which calls this workflow -- do not add a
# push/tags trigger here or a tag would build twice.
on:
  workflow_call:
    inputs:
      geoip:
        description: Ship the GeoLite2-Country database from release.yml's geoip-db artifact
        type: boolean
        default: false
      ref:
        description: Commit to build; release.yml passes the tag, since its run is on main
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty = the run's own commit
          submodules: true   # external/enodemeta: .proto + test vectors

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            zlib1g-dev \
            protobuf-compiler   # protoc for qt_add_protobuf (enodemeta)

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: linux_gcc_64
          modules: qthttpserver qtwebsockets qtmultimedia qtgrpc   # qtgrpc ships QtProtobuf
          cache: true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF
          -DEMULE_SEED_FROM_SOURCE_TREE=OFF

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release builds only: release.yml downloads the database once and hands it
      # to all three platforms; the bundlers copy data/config wholesale.
      - name: Fetch GeoLite2-Country database
        if: ${{ inputs.geoip }}
        uses: actions/download-artifact@v8
        with:
          name: geoip-db
          path: data/config

      - name: Bundle
        run: scripts/bundle-linux.sh deploy-qt build

      # The bundle script checks that the files are there; this checks that the
      # shipped bridge starts from the unpacked tarball with its bundled libs.
      - name: Smoke-test the bundled MCP bridge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          tar xzf build/eMuleQt-v*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/eMuleQt/emuleqt-mcp" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-linux-x86_64
          path: build/eMuleQt-v*-linux-x86_64.tar.gz
          # Default is 'warn', which would leave the job green with no artifact
          # if the bundle script produced nothing.
          if-no-files-found: error
