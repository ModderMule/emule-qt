name: Linux CI

# Tag pushes are handled by release.yml, which calls this workflow -- do not add a
# push/tags trigger here or a tag would build twice.
on:
  workflow_call:
    inputs:
      geoip:
        description: Ship the GeoLite2-Country database from release.yml's geoip-db artifact
        type: boolean
        default: false
      resolver:
        description: Ship the hoster resolver from release.yml's resolver-zip artifact
        type: boolean
        default: false
      ref:
        description: Commit to build; release.yml passes the tag, since its run is on main
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ed3k early alpha: node locked off in CI builds (CMakeLists.txt EMULE_ED3K_LOCKED)
  EMULE_ED3K_LOCKED: "1"

jobs:
  build:
    # The glibc of the build host is the floor of the tarball, so build in an
    # Ubuntu 22.04 container (glibc 2.35). Not the ubuntu-22.04 runner: GitHub is
    # retiring it. Never ubuntu-latest: v0.6.23 came from a 26.04 runner and
    # needed glibc 2.43 (issues #43, #44). Change only together with GLIBC_MAX below.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      QT_VERSION: "6.10.3"
      QT_ROOT_DIR: /opt/Qt/6.10.3/gcc_64
      # 22.04 default is GCC 11; GCC 12 is the newest in its archive. Code must
      # stay buildable with it (no std::ranges::contains, std::print, ...).
      CC: gcc-12
      CXX: g++-12
      # scripts/build-linux-deps.sh output; a container path, not runner.temp
      # (that context is the host's path in a container job)
      LINUX_DEPS: /opt/linux-deps
      # ed3k: packmule is the private ModderMule/packmule; without the secret
      # (forks, 3rd party) it is skipped and EMULE_ED3K turns itself off
      HAS_PACKMULE_TOKEN: ${{ secrets.PACKMULE_TOKEN != '' }}

    steps:
      # Before checkout: without git it falls back to a tarball, without submodules
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git squashfs-tools binutils \
            gcc-12 g++-12 make perl ninja-build ccache pkg-config \
            python3 python3-pip python3-venv \
            protobuf-compiler \
            zlib1g-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libdbus-1-dev libglib2.0-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-randr0-dev
          # 22.04 ships CMake 3.22; the project needs 3.25+
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install --quiet 'cmake~=3.31' aqtinstall
          echo /opt/tools/bin >> "$GITHUB_PATH"
          echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"   # qmake for linuxdeploy-plugin-qt

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty = the run's own commit
          submodules: true   # external/enodemeta: .proto + test vectors

      # libs/packmule stays gitignored; the commit is pinned in scripts/packmule.ref
      - name: Read packmule ref
        if: env.HAS_PACKMULE_TOKEN == 'true'
        run: echo "PACKMULE_REF=$(tr -d '[:space:]' < scripts/packmule.ref)" >> "$GITHUB_ENV"

      - name: Checkout packmule
        if: env.HAS_PACKMULE_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: ModderMule/packmule
          ref: ${{ env.PACKMULE_REF }}
          token: ${{ secrets.PACKMULE_TOKEN }}
          path: libs/packmule
          persist-credentials: false

      # packmule rust-version 1.98; the container has no Rust
      - name: Install Rust
        if: env.HAS_PACKMULE_TOKEN == 'true'
        run: |
          curl -fsSL --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        if: env.HAS_PACKMULE_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/packmule-ffi/cargo
          key: cargo-linux-x86_64-${{ hashFiles('scripts/packmule.ref', 'libs/packmule/Cargo.lock') }}
          restore-keys: cargo-linux-x86_64-

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/Qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-httpserver-websockets-multimedia-grpc

      # aqt directly (what install-qt-action wraps): no host Python setup in the container
      - name: Install Qt 6
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64
          -m qthttpserver qtwebsockets qtmultimedia qtgrpc
          -O /opt/Qt

      # OpenSSL 3.5 (shared) + ngtcp2 (static): 22.04's OpenSSL 3.0 has no QUIC
      # TLS API, which the QUIC NAT-T transport needs. No apt libssl-dev on
      # purpose: one OpenSSL in the build and in the tarball. Boost headers for
      # the static libtorrent (FetchContent) that BitTorrent builds against it.
      - name: Restore OpenSSL/ngtcp2/Boost
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LINUX_DEPS }}
          key: linux-deps-ubuntu22.04-gcc12-${{ hashFiles('scripts/build-linux-deps.sh') }}

      - name: Build OpenSSL/ngtcp2/Boost
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/build-linux-deps.sh "$LINUX_DEPS"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$LINUX_DEPS"
          -DOPENSSL_ROOT_DIR="$LINUX_DEPS"
          -DOPENSSL_USE_STATIC_LIBS=OFF
          -DEMULE_BITTORRENT=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DEMULE_BUILD_TESTS=OFF
          -DEMULE_SEED_FROM_SOURCE_TREE=OFF

      # a failed fetch or a missing cargo would ship without ed3k, silently
      - name: Check ed3k is configured
        if: env.HAS_PACKMULE_TOKEN == 'true'
        run: |
          grep -q '^EMULE_ED3K:BOOL=ON' build/CMakeCache.txt \
            || { echo "::error::packmule was fetched but EMULE_ED3K is off"; exit 1; }

      - name: Build
        run: cmake --build build --parallel 2

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --output-on-failure --parallel

      - name: Get version
        run: |
          VERSION=$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release builds only: release.yml downloads the database once and hands it
      # to all three platforms; the bundlers copy data/config wholesale.
      - name: Fetch GeoLite2-Country database
        if: ${{ inputs.geoip }}
        uses: actions/download-artifact@v8
        with:
          name: geoip-db
          path: data/config

      # Release builds only: scripts/publish-release.sh builds it from JD's sources,
      # release.yml checks it against the tag; bundle-linux.sh's default path
      - name: Fetch hoster resolver
        if: ${{ inputs.resolver }}
        uses: actions/download-artifact@v8
        with:
          name: resolver-zip
          path: build/hoster-resolver

      - name: Bundle
        env:
          GLIBC_MAX: "2.35"   # Ubuntu 22.04, Linux Mint 21, Debian 12
        # ldd/linuxdeploy resolve libssl/libcrypto to the 3.5 build, not 22.04's 3.0
        run: LD_LIBRARY_PATH="$LINUX_DEPS/lib" scripts/bundle-linux.sh deploy-qt build

      # The bundle script checks that the files are there; this checks that the
      # shipped bridge starts from the unpacked tarball with its bundled libs.
      - name: Smoke-test the bundled MCP bridge
        # container default shell is sh (dash): no pipefail
        shell: bash
        env:
          RESOLVER: ${{ inputs.resolver }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          tar xzf build/eMuleQt-v*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/eMuleQt/emuleqt-mcp" --version
          # QUIC NAT-T needs the bundled OpenSSL to be the 3.5 build (not cmp:
          # linuxdeploy patches the rpath of what it bundles)
          lib="$RUNNER_TEMP/verify/eMuleQt/lib"
          grep -aq 'OpenSSL 3\.5\.' "$lib/libcrypto.so.3" \
            || { echo "Error: bundled libcrypto.so.3 is not OpenSSL 3.5" >&2; exit 1; }
          grep -aq SSL_set_quic_tls_cbs "$lib/libssl.so.3" \
            || { echo "Error: bundled libssl.so.3 has no QUIC TLS API" >&2; exit 1; }
          # libtorrent is linked static into emulecored
          if ls "$lib"/libtorrent-rasterbar* >/dev/null 2>&1; then
            echo "Error: libtorrent-rasterbar bundled as a shared lib" >&2; exit 1
          fi
          if [ "$RESOLVER" = true ] && [ ! -s "$RUNNER_TEMP/verify/eMuleQt/resolver.zip" ]; then
            echo "Error: resolver.zip missing from the tarball" >&2; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-linux-x86_64
          path: build/eMuleQt-v*-linux-x86_64.tar.gz
          # Default is 'warn', which would leave the job green with no artifact
          # if the bundle script produced nothing.
          if-no-files-found: error
