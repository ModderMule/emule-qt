name: Windows CI

on:
#  push:
#    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # - name: Install Qt 6
      #   uses: jurplel/install-qt-action@v4
      #   with:
      #     version: "6.10.3"
      #     arch: win64_msvc2022_64
      #     modules: qthttpserver qtwebsockets qtmultimedia

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          $qtDir = "D:\Qt"

          Write-Host "=== Available modules for 6.10.3 win64_msvc2022_64 ==="
          aqt list-qt windows desktop --modules 6.10.3 win64_msvc2022_64

          Write-Host "=== Installing Qt base + modules ==="
          aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -m qthttpserver qtwebsockets qtmultimedia -O $qtDir --base https://ftp.fau.de/qtproject/

          $root = "$qtDir\6.10.3\msvc2022_64"
          echo "QT_ROOT_DIR=$root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$root" >> $env:GITHUB_ENV
          echo "$root\bin" >> $env:GITHUB_PATH

          Write-Host "=== Verifying Qt6WebSockets ==="
          if (Test-Path "$root\lib\cmake\Qt6WebSockets") {
            Write-Host "OK: Qt6WebSockets found"
          } else {
            Write-Host "WARN: Qt6WebSockets NOT found, listing cmake dir:"
            Get-ChildItem "$root\lib\cmake" -Directory | Select-Object Name
          }

      - name: Install dependencies (vcpkg)
        run: vcpkg install zlib openssl --triplet x64-windows

      # let Ninja use the MSVC compiler
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DEMULE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --build-config Release --output-on-failure --parallel

      - name: Get version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION\s+(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Bundle
        run: scripts\bundle-win.bat "$env:QT_ROOT_DIR" Release --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-win64
          path: build/emuleqt-v*-win64.zip
