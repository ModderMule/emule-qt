name: Windows CI

# Tag pushes are handled by release.yml, which calls this workflow -- do not add a
# push/tags trigger here or a tag would build twice.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Release-only triplet: identical to x64-windows (dynamic CRT, dynamic library
  # linkage, same DLL names) except that it skips the debug variant of every
  # dependency.  That variant alone cost 3:21 of an 8:56 dependency step and this
  # job never links it.  Also read by scripts\build-win.ps1's Resolve-VcpkgTriplet,
  # so bundling looks under vcpkg_installed\x64-windows-release\ instead.
  VCPKG_TARGET_TRIPLET: x64-windows-release
  VCPKG_DISABLE_METRICS: '1'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # - name: Install Qt 6
      #   uses: jurplel/install-qt-action@v4
      #   with:
      #     version: "6.10.3"
      #     arch: win64_msvc2022_64
      #     modules: qthttpserver qtwebsockets qtmultimedia

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          $qtDir = "D:\Qt"

          Write-Host "=== Available modules for 6.10.3 win64_msvc2022_64 ==="
          aqt list-qt windows desktop --modules 6.10.3 win64_msvc2022_64

          Write-Host "=== Installing Qt base + modules ==="
          aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -m qthttpserver qtwebsockets qtmultimedia -O $qtDir --base https://ftp.fau.de/qtproject/

          $root = "$qtDir\6.10.3\msvc2022_64"
          echo "QT_ROOT_DIR=$root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$root" >> $env:GITHUB_ENV
          echo "$root\bin" >> $env:GITHUB_PATH

          Write-Host "=== Verifying Qt6WebSockets ==="
          if (Test-Path "$root\lib\cmake\Qt6WebSockets") {
            Write-Host "OK: Qt6WebSockets found"
          } else {
            Write-Host "WARN: Qt6WebSockets NOT found, listing cmake dir:"
            Get-ChildItem "$root\lib\cmake" -Directory | Select-Object Name
          }

      # vcpkg's own binary cache lives on the runner's system drive and dies with
      # the VM, so without this every run rebuilt OpenSSL from source (8.6 min).
      # Restore/save are split rather than using actions/cache: the single-step
      # form does not save when a later step fails (save-always is deprecated in
      # v4.2), and losing a 5-8 minute dependency build to an unrelated compile
      # error is exactly the case worth protecting.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          # Unique per run on purpose.  GitHub caches are immutable: a key that
          # already exists is never overwritten, so a fixed key would freeze
          # whatever the first run happened to populate -- including a partial
          # population from a run that died half way through.
          key: vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # vcpkg's store is content-addressed by package ABI hash, so restoring a
          # stale entry is harmless -- it simply misses and rebuilds.  Restore as
          # broadly as possible.  The runner's vcpkg commit and the image version
          # are deliberately NOT in the key: src\vcpkg.json pins builtin-baseline,
          # so a vcpkg HEAD bump does not change any package's ABI hash, and
          # keying on it would force a full rebuild for nothing.  A genuine MSVC
          # bump changes the ABI hash and vcpkg rebuilds on its own.
          restore-keys: |
            vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-
            vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "vcpkg registry HEAD: $(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --short HEAD)"

          # src\vcpkg.json pins builtin-baseline; the runner's clone must contain
          # that commit or version resolution fails with a confusing message.
          $baseline = (Get-Content src\vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Baseline $baseline not in the runner's vcpkg clone -- fetching."
            git -C $env:VCPKG_INSTALLATION_ROOT fetch --depth=1 origin $baseline
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch vcpkg baseline $baseline" }
          }

          # Manifest mode, so libarchive/yaml-cpp/miniupnpc come from vcpkg rather
          # than being cloned and rebuilt by FetchContent at configure time.  The
          # manifest lives in src\, not the CMake source root, hence
          # --x-manifest-root.  --x-install-root must match the VCPKG_INSTALLED_DIR
          # passed to cmake below and the path Resolve-VcpkgBinDir searches.
          #
          # Kept as its own step rather than letting the toolchain auto-install
          # during project(): that would fold the whole dependency build into the
          # Configure step's wall clock and surface port failures as CMake errors.
          vcpkg install `
            --x-manifest-root=src `
            --x-install-root="$PWD\build\vcpkg_installed" `
            --triplet $env:VCPKG_TARGET_TRIPLET `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }

          Get-ChildItem "$PWD\build\vcpkg_installed\$env:VCPKG_TARGET_TRIPLET\bin" -Filter *.dll |
            ForEach-Object { Write-Host "  installed: $($_.Name)" }

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # let Ninja use the MSVC compiler (also puts dumpbin on PATH for the
      # bundle verification step below)
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_DIR="$PWD\src" `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DVCPKG_INSTALLED_DIR="$PWD\build\vcpkg_installed" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DEMULE_BUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

#      - name: Run tests
#        continue-on-error: true
#        env:
#          QT_QPA_PLATFORM: offscreen
#        run: ctest --test-dir build --build-config Release --output-on-failure --parallel

      - name: Get version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION\s+(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      # -RequireVcpkg: without it a triplet the bundler cannot resolve only
      # produced a note, and the job stayed green while shipping a zip with no
      # zlib (z.dll) and no OpenSSL.
      - name: Bundle
        shell: pwsh
        run: scripts\bundle-win.ps1 -QtDir "$env:QT_ROOT_DIR" -Config Release -NoBuild -RequireVcpkg

      # Validates the artifact rather than the process: the upload guard below
      # only checks that a zip exists, not that it is loadable.
      - name: Verify bundle is self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem build\eMuleQt-v*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw 'No zip produced.' }

          $out = Join-Path $env:RUNNER_TEMP 'verify'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $out
          $app = Join-Path $out 'eMule'

          $present = @{}
          Get-ChildItem $app -Recurse -Filter *.dll |
            ForEach-Object { $present[$_.Name.ToLower()] = $true }

          # 1. Every DLL vcpkg installed must have reached the zip.  This is the
          # check that catches the failure this whole guard exists for -- a
          # triplet or layout change that makes bundle-win.ps1 copy nothing.
          #
          # Derived from the install tree rather than a hardcoded name list:
          # dependency DLL names drift (zlib 1.3.2 renamed zlib1.dll to z.dll),
          # and a stale hardcoded name fails a perfectly good bundle while a
          # genuinely missing DLL goes unnoticed.
          $vcpkgBin = Join-Path $PWD "build\vcpkg_installed\$env:VCPKG_TARGET_TRIPLET\bin"
          if (-not (Test-Path $vcpkgBin)) { throw "vcpkg install tree not found at $vcpkgBin" }
          $vcpkgDlls = @(Get-ChildItem $vcpkgBin -Filter *.dll | ForEach-Object { $_.Name })
          if ($vcpkgDlls.Count -eq 0) {
            throw "No DLLs under $vcpkgBin -- the dependency install did not produce a shared build."
          }
          $absent = @($vcpkgDlls | Where-Object { -not $present.ContainsKey($_.ToLower()) })
          if ($absent) { throw "Bundle is missing vcpkg DLL(s): $($absent -join ', ')" }
          Write-Host "OK: all $($vcpkgDlls.Count) vcpkg DLL(s) present in the bundle."

          # 2. Import closure.  Fail only on imports that were *supposed* to be
          # bundled -- anything vcpkg built, or a Qt module.  Missing OS DLLs are
          # reported but not fatal on purpose: this runner is Windows Server and
          # users are on desktop Windows, so System32 here says nothing about
          # System32 there (Media Foundation, uiautomationcore and d3d12 all
          # differ between the two).  Failing on those would red-flag a good
          # bundle over a runner-image detail.
          $mustBundle = @{}
          $vcpkgDlls | ForEach-Object { $mustBundle[$_.ToLower()] = $true }

          $broken = @()
          $external = @{}
          $images = Get-ChildItem $app -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' }
          foreach ($img in $images) {
            $deps = @()
            $inSection = $false
            foreach ($line in (& dumpbin /nologo /dependents $img.FullName)) {
              if ($line -match 'Image has the following dependencies:') { $inSection = $true; continue }
              if (-not $inSection) { continue }
              # Stop before the delay-load section: a delay-load import is
              # optional at load time and windeployqt drops some deliberately
              # (--no-opengl-sw, --no-system-d3d-compiler).
              if ($line -match 'delay load dependencies:' -or $line -match '^\s*Summary') { break }
              if ($line -match '^\s{4}(\S+\.dll)\s*$') { $deps += $Matches[1].ToLower() }
            }
            foreach ($d in $deps) {
              if ($present.ContainsKey($d)) { continue }
              if ($d -like 'api-ms-win-*' -or $d -like 'ext-ms-*') { continue }
              if ($mustBundle.ContainsKey($d) -or $d -like 'qt6*') {
                $broken += "$($img.Name) -> $d"
                continue
              }
              $external[$d] = $true
            }
          }
          if ($broken) {
            throw "Bundled images import DLLs missing from the bundle:`n  $($broken -join "`n  ")"
          }

          Write-Host "OK: $($present.Count) DLL(s) in bundle, $($images.Count) images checked."
          Write-Host "Resolved from the OS at runtime ($($external.Count)): $((($external.Keys | Sort-Object) -join ', '))"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: eMuleQt-v${{ env.APP_VERSION }}-win64
          path: build/eMuleQt-v*-win64.zip
          # Default is 'warn', which would leave the job green with no artifact
          # if the bundle script produced nothing.
          if-no-files-found: error

      # A minidump binds to a PDB by GUID+age and every rebuild mints a new GUID,
      # so a crash dump can only ever be symbolised against the PDB from that exact
      # build.  These were previously discarded with the runner, which made
      # EMULE_RELEASE_DEBUG_INFO pointless for released builds.
      #
      # Deliberately NOT named eMuleQt-v*: release.yml downloads that pattern and
      # publishes everything it finds, and the symbols do not belong in the public
      # release assets.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: debug-symbols-win64-v${{ env.APP_VERSION }}
          path: build/**/*.pdb
          if-no-files-found: error
