name: Release

# Fires when scripts/publish-release.sh pushes a vX.Y.Z tag. Builds all three
# platforms by calling the per-OS workflows as reusable workflows, then publishes
# a GitHub Release with their archives attached -- the page that the update
# manifest's "releaseNotes" URL points at (see scripts/publish-release.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Floor for the whole run; the release job raises itself to contents: write.
# A called workflow can only downgrade what the calling job hands it.
permissions:
  contents: read

concurrency:
  # Serialise re-runs of the same tag, but never cancel: a v0.2.1 push does not
  # supersede an in-flight v0.2.0, and cancelling mid-publish strands a release
  # with only some of its assets.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate: ~10s, so a mismatch never burns three ~30min builds that would
  # produce artifacts named differently from the tag.
  guard:
    name: Verify tag matches CMakeLists.txt
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout (CMakeLists.txt only)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Compare tag with project version
        id: check
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release must run from a tag (ref_type=${GITHUB_REF_TYPE}, ref_name=${GITHUB_REF_NAME})"
            exit 1
          fi

          # Same grep the build workflows and the bundle scripts use, so there is
          # no second parser to drift.
          version="$(grep -m1 '^ *VERSION [0-9]' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "${version}" ]; then
            echo "::error file=CMakeLists.txt::Could not parse VERSION from CMakeLists.txt"
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error file=CMakeLists.txt::Tag ${GITHUB_REF_NAME} does not match project version ${version} (expected tag v${version}). Fix CMakeLists.txt or re-tag."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "OK: tag ${GITHUB_REF_NAME} matches project version ${version}"

  # One GeoLite2-Country database per release, shared by all three platforms.
  # CI has no MaxMind credentials: scripts/publish-release.sh downloads it
  # locally, rsyncs it to https://emule-qt.org/pub/ before pushing the tag and
  # writes its SHA-256 into the annotated tag message. This job fetches it and
  # fails on a mismatch rather than silently shipping a stale/foreign database.
  geoip:
    name: Fetch GeoLite2-Country
    needs: guard
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GEOIP_URL: https://emule-qt.org/pub/GeoLite2-Country.mmdb
    steps:
      # Direct tag fetch instead of actions/checkout, which rewrites annotated
      # tags as lightweight ones and so loses the message.
      - name: Read expected SHA-256 from the tag
        id: tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          sha="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}" \
                 | sed -n 's/^GeoLite2-Country-SHA256: *\([0-9a-f]\{64\}\) *$/\1/p' | head -n1)"
          if [ -z "$sha" ]; then
            echo "::error::Tag ${TAG} has no 'GeoLite2-Country-SHA256:' line -- create release tags with scripts/publish-release.sh"
            exit 1
          fi
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Download
        env:
          EXPECTED: ${{ steps.tag.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p geoip
          curl -fsSL --retry 3 --retry-delay 5 -o geoip/GeoLite2-Country.mmdb "$GEOIP_URL"
          actual="$(sha256sum geoip/GeoLite2-Country.mmdb | awk '{print $1}')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::${GEOIP_URL} is not the database tagged in ${TAG} (expected ${EXPECTED}, got ${actual}). A later publish may have replaced it -- re-upload the matching file."
            exit 1
          fi
          echo "OK: GeoLite2-Country.mmdb sha256 ${actual}"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: geoip-db
          path: geoip/GeoLite2-Country.mmdb
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux
    needs: [guard, geoip]
    permissions:
      contents: read
    uses: ./.github/workflows/linux.yml
    with:
      geoip: true

  macos:
    name: macOS
    needs: [guard, geoip]
    permissions:
      contents: read
    uses: ./.github/workflows/macos.yml
    with:
      geoip: true

  windows:
    name: Windows
    needs: [guard, geoip]
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml
    with:
      geoip: true

  release:
    name: Publish GitHub Release
    needs: [guard, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      # Only job that can write. The Releases API lives under `contents`.
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # full history, for the previous-tag compare link

      # The called workflows ran inside THIS run, so their artifacts need no
      # run-id and no token to fetch.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: eMuleQt-v*
          merge-multiple: true    # load-bearing: flattens all three into dist/

      - name: Verify assets and generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail

          assets=(
            "eMuleQt-v${VERSION}-linux-x86_64.tar.gz"
            "eMuleQt-v${VERSION}-macOS.dmg"
            "eMuleQt-v${VERSION}-win64.zip"
          )

          missing=0
          for f in "${assets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected release asset missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- contents of dist/ ---"
            ls -la
            exit 1
          fi

          sha256sum "${assets[@]}" | tee SHA256SUMS.txt

      - name: Build release notes
        run: |
          set -euo pipefail

          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
          else
            compare="https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          fi

          {
            echo "## eMuleQt ${TAG}"
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| Linux x86_64 | \`eMuleQt-v${VERSION}-linux-x86_64.tar.gz\` |"
            echo "| macOS (Apple silicon) | \`eMuleQt-v${VERSION}-macOS.dmg\` |"
            echo "| Windows x64 | \`eMuleQt-v${VERSION}-win64.zip\` |"
            echo
            echo "**Full changelog:** ${compare}"
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "This release includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com."
          } > release-notes.md

          cat release-notes.md

      # Upserts, so re-running the workflow for an existing tag just replaces the
      # assets. Auth is the per-run GITHUB_TOKEN scoped by this job's
      # `permissions: contents: write` -- not tied to any personal account.
      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: eMuleQt ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true    # appended below body_path
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          token: ${{ github.token }}

      # Equivalent gh CLI implementation -- kept for later, deliberately not used
      # (this project does not use the gh CLI).
      # - name: Create or update the GitHub Release (gh)
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     set -euo pipefail
      #     if gh release view "${TAG}" >/dev/null 2>&1; then
      #       gh release upload "${TAG}" dist/* --clobber
      #     else
      #       gh release create "${TAG}" dist/* \
      #         --title "eMuleQt ${TAG}" \
      #         --notes-file release-notes.md \
      #         --generate-notes \
      #         --verify-tag
      #     fi
      #     gh release view "${TAG}" --json url,assets \
      #       --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'

      - name: Summary
        run: |
          {
            echo "### Released ${TAG}"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
