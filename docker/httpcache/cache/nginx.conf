# ---------------------------------------------------------------------------
# nginx.conf — the whole server, not just a vhost, so the log format and the
# access-log destination are ours. Adapted from the backend's own
# docs/nginx.conf.sample; the reasons below come from there.
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # The rig's analyzer reads this out of `docker compose logs`, so it must say
    # method, path and status on one line. The upstream sample scrubs the chunk
    # id out of the log because the id IS the capability — here the whole point
    # is to correlate a GET with the POST that created it, and the network is a
    # throwaway bridge, so the id stays.
    # $request_uri, not $uri: every request is rewritten to /index.php by
    # try_files, and $uri is the rewritten one — so the chunk id, the whole point
    # of the line, would be gone by the time it is logged.
    log_format  rig  '$request_method $request_uri $status $body_bytes_sent '
                     'range="$http_range" from=$remote_addr';
    access_log  /dev/stdout  rig;

    server {
        listen 80 default_server;
        server_name _;
        root /app;

        # A padded part is 9,728,016 bytes and nginx defaults to 1m, so without
        # this every publish is a 413 before PHP sees the body.
        client_max_body_size 12m;

        # Without this "/" resolves to the directory, finds no index.html and
        # answers 403 instead of the status page.
        index index.php;

        # One entry point. Chunks are served by PHP, never off the disk.
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;

            # Not in the stock fastcgi_params; without it php-fpm has no script
            # to run and answers "No input file specified".
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Belt and braces: keeps Auth::identify() working even if an included
            # snippet ever turns fastcgi_pass_request_headers off.
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;

            # Stream the upload straight into php://input instead of spooling all
            # 9.28 MB to a temp file first, and stream the response back so a
            # Range request starts moving at once rather than being buffered whole.
            fastcgi_request_buffering off;
            fastcgi_buffering off;

            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 120s;
        }

        # Ciphertext, sidecars, quota counters and the CLI tools are never
        # web-reachable. nginx does not read .htaccess, so this restates the
        # protection those directories have under Apache.
        location ~ ^/(storage|var|tests|bin)/ {
            return 404;
        }

        # Only index.php runs. This also stops config.php — which holds the API
        # secret — being served as plain text if the PHP handler ever goes missing.
        location ~ \.php$ {
            return 404;
        }

        # .htaccess, and the .tmp-* files of an interrupted upload.
        location ~ /\. {
            return 404;
        }
    }
}
