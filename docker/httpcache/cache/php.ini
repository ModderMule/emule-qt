; A padded eMule part is 9,728,016 bytes. php-fpm's 8M default would refuse it
; with a 413 before the app ever read php://input.
post_max_size = 12M
upload_max_filesize = 12M

; Store reads the body in 1 MiB slices and RangeResponse writes it out the same
; way, so neither ever holds a whole chunk — the default limit is plenty.
memory_limit = 128M

; A 9.28 MB upload over a throttled publish rate can legitimately take a while.
max_execution_time = 120

; The API is machine-facing: a warning printed into a JSON body or, worse, into
; a chunk, would corrupt it. index.php sets these too; this covers the installer.
display_errors = Off
log_errors = On
error_log = /dev/stderr
